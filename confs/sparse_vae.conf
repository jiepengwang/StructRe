general{
    exp_name = ./exps/sparse_vae

    recording = [./, ./model, ./model/sparse_vae, ./model/part_vae, ./model/structmapping, ./confs ]
}

dataset{
    dataset_name = partnet

    scale_cube = 1.0

    mode_shape = shape_aug_rotation

    max_dataset_size = 100000000
    max_category_size = 100000000

    drop_last = True
    shuffle = True
    use_np_shuffle = True
    should_shuffle_test_data = True

    trunc_thres = 0.2
    category = all
}

train{
    num_epochs = 400
    lr = 1e-4
    lr_decay = 100

    div_factor = 25.0
    final_div_factor = 10000.0

    # Validation
    freq_report = 100
    freq_valid_mesh = 100
    freq_save = 1  # Checkpoint interval in epochs

    should_extract_code = False

    # Loss weights
    sdf_weight = 1.0
    occu_weight = 1.0
    klreg_weight = 1e-6

    max_sample_points_grid = 8192

    scale_gt_sdf = 10.0

}

model{
    arch = sparse_vae

    channels_encoder = [16, 32, 64, 128, 128, 256, 512, 1024]
    channels_decoder = [16, 32, 64, 128, 128, 256, 512, 1024]

    tsdf_thres_trunc_decoder = 0.02

    n_layers_resblock_enc = 1
    k_pre_conv_enc = 1

    n_blocks_downsample = 5
    n_blocks_upsample = 4

    latent{
        dim = 256
    }
}
