general{
    config_sparse_vae = ./confs/sparse_vae.conf
    exp_name = ./exps/part_vae

    recording = [./, ./model, ./model/sparse_vae, ./model/part_vae, ./model/structmapping, ./confs ]
}

dataset{
    dataset_name = partnetcode

    max_dataset_size = 1e8
    max_category_size = 1e8

    drop_last = True
    shuffle = True
    use_np_shuffle = True
    should_shuffle_test_data = True

    category = all

}

train{
    num_epochs = 800
    lr = 1e-4
    lr_decay = 100

    div_factor = 25.0
    final_div_factor = 10000.0

    # Validation
    freq_report = 200
    freq_valid_mesh = 200
    freq_save = 1  # Checkpoint interval in epochs
    freq_save_step = 50000

    # Loss weights
    recon_weight = 2.0
    klreg_weight = 1e-6
    status_weight = 1.0
    empty_weight = 0.2

    lis_level_weight = [8, 4, 2, 1]

}

model{
    arch = part_vae

    # Load the Stage 1 geometry decoder when needed.
    should_load_sparse_vae = False

    # Positional encoding
    pe{
        n_emb = 8
        dim_emb = 32
    }

    # Structural latent
    latent{
        dim = 512
    }

    # Transformer
    encoder{
        embed_dim = 768
        nhead = 12
        nlayers_enc = 6
        d_hid = 1024
        dropout = 0.0
        activation = relu

        normalize_before = True
    }

    decoder{
        seq_len = 512  # Number of patch queries

        embed_dim = 768
        nhead = 12
        nlayers_enc = 6
        d_hid = 1024
        dropout = 0.0
        activation = relu

        normalize_before = True

        code_decoder{
            n_layers = 3
            d_hidden = 1024
        }

        status_decoder{
            n_layers = 3
            d_hidden = 1024
        }
    }
}
