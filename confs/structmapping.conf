general{
    config_part_vae = ./confs/part_vae.conf

    exp_name = ./exps/structmapping

    recording = [./, ./model,
                    ./model/sparse_vae, ./model/part_vae, ./model/structmapping,
                    ./utils,
                    ./utils ]
}

dataset{
    dataset_name = hierarchy_code

    max_dataset_size = 10000000
    max_category_size = 1000000

    drop_last = True
    shuffle = True
    use_np_shuffle = True
    should_shuffle_test_data = True

    category = all
}

train{
    num_epochs = 800
    lr = 1e-4
    lr_decay = 50
    div_factor = 25.0
    final_div_factor = 10000.0

    # Validation
    freq_report = 100
    freq_valid_mesh = 100
    freq_save = 100  # Checkpoint interval in epochs
    freq_save_step = 2000

    thres_prob_valid_part = 0.2

    # Query counter
    freq_reset_counter = 2
    counter_min = 20

    loss{
        weight_bbox = 5.0
        weight_cls = 1.0
        weight_status = 0.1

        weight_pointer = 0.1

        reg_loss_type = l2
    }

}

model{
    arch = structmapping
    should_load_sparse_vae = False

    # Structure index capacity used by hierarchy targets
    dim_emb_patch_code = 256
    dim_emb_code = 512
    num_emb_struct = 60000

    # Child-parent pointer
    pointer{
        n_layers = 3
        d_hidden = 1024,
        d_output = 256
    }

    # Iterative decoding
    sampling_strategy_infer = topk_schedule
    filter_strategy_infer = conf_filter_inside_accum
    n_iter = 5
    lis_schedule_conf_iter = [0.95, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1]

    # Positional encoding
    pe{
        bbox_size = 2.3
        n_emb = 128
        dim_emb = 64

        n_emb_rot = 72
    }

    # Transformer
    encoder{
        embed_dim = 768
        nhead = 12
        nlayers_enc = 6
        d_hid = 1024
        dropout = 0.0
        activation = relu

        normalize_before = True

        mlp_pre_patch{
            n_layers = 3
            d_hidden = 1024
        }
        mlp_pre_struct_pe{
            n_layers = 3
            d_hidden = 1024
        }
    }

    decoder{
        # DETR-style queries
        detr{
            num_queries = 256

            eos_coef = 0.2  # Empty-query loss weight
        }

        embed_dim = 768
        nhead = 12
        nlayers_enc = 6
        d_hid = 1024
        dropout = 0.0
        activation = relu

        normalize_before = True

        status{
            n_layers = 3
            d_hidden = 1024,
        }

        bbox{
            n_layers = 3
            d_hidden = 1024
            d_output = 8
        }

        cls{
            n_layers = 3
            d_hidden = 1024,
        }
    }

}
